[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-serving-bench"
version = "0.1.0"
description = "Rigorous, reproducible benchmark harness for LLM serving: frozen prompts, fixed-window throughput/TTFT/TPOT, paired A/B with 95% CI, and validity gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["llmops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
